[permissions]
allow = ["Bash(cd /www/wwwroot/local.host && git status --short)", "Bash(cd /www/wwwroot/local.host && timeout 90 php artisan test --compact tests/Unit/TransactionStateMachineTest.php 2>&1 | tail -8)", "Bash(cd /www/wwwroot/local.host && sed -n '403,414p' app/Services/Transaction/TransactionStateMachine.php)", "Bash(cd /www/wwwroot/local.host && grep -n \"approve_and_complete_refund_transaction\" tests/Unit/TransactionStateMachineTest.php)", "Bash=cat > /tmp/local.host.conf << 'EOF'\nserver {\n    listen 80;\n    listen 443 ssl;\n    server_name local.host;\n    root /www/wwwroot/local.host/public;\n    index index.php index.html;\n    ssl_certificate /www/server/panel/vhost/ssl/local.host/fullchain.pem;\n    ssl_certificate_key /www/server/panel/vhost/ssl/local.host/privkey.pem;\n    location / { try_files $uri $uri/ /index.php?$query_string; }\n    location ~ \\.php$ { fastcgi_pass unix:/tmp/php-cgi-83.sock; fastcgi_index index.php; include fastcgi.conf; include pathinfo.conf; }\n    location ~ /\\.(?!well-known).* { deny all; }\n}\nEOF\necho \"Written to /tmp/local.host.conf\"\ncat /tmp/local.host.conf", "run_skill"]

[sandbox]
allow_write = ["/tmp"]
